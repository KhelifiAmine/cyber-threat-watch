services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: cybershield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cybershield}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set a strong DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-cybershield}
    ports:
      # SECURITY: bind to loopback only — not reachable from other hosts on the segment.
      # For the internal deployment, remove this mapping entirely (use the Docker network).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Cache + Celery Broker) ───
  redis:
    image: redis:7-alpine
    container_name: cybershield-redis
    restart: unless-stopped
    # SECURITY: require a password. Set REDIS_PASSWORD in .env and update REDIS_URL to
    # redis://:${REDIS_PASSWORD}@redis:6379/0 for backend, worker, beat (coordinated change).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}"]
    ports:
      # SECURITY: loopback only. Remove entirely for the internal deployment.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mailpit (Dev Email Server) ───
  # Web UI: http://localhost:8025
  # SMTP: mailpit:1025 (internal only)
  # DO NOT use in production — replace with real SMTP relay
  mailpit:
    image: axllent/mailpit:latest
    container_name: cybershield-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # Web UI — localhost only for security
    expose:
      - "1025"                   # SMTP — internal Docker network only
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-cybershield}:${DB_PASSWORD:?set a strong DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # ─── SMTP (Mailpit for dev, override in .env for production) ───
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-alerts@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CyberShield AI}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-server-header

  # ─── Celery Worker (Background Tasks) ───
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-celery-worker
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-cybershield}:${DB_PASSWORD:?set a strong DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # ─── SMTP (worker sends the actual emails) ───
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-alerts@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CyberShield AI}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      NVD_API_KEY: ${NVD_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: bash scripts/start_worker.sh

  # ─── Celery Beat (Scheduled Tasks) ───
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-cybershield}:${DB_PASSWORD:?set a strong DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info

  # ─── React Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybershield-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm start

volumes:
  postgres_data: